<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frequency Buddy – Entwurf 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Figtree:wght@400..800&family=Inter:wght@400..800&family=Manrope:wght@400..800&family=Plus+Jakarta+Sans:wght@400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
:root{
  /* Hell: Off-White, Navy-Tinte */
  --bg:#F4F3EE; --stage:#E2E1DA; --surface:#FBFAF7; --fill:#E9E8E2; --thumb:#FBFAF7;
  --text:#12213F; --text2:#5A6579; --line:#E2E0D8;
  --btn-bg:#12213F; --btn-fg:#F4F3EE; --hl:#4D8FE3;
  --hero-bg:#0F1B36; --hero-text:#F4F3EE; --hero-sub:#9AA8C2;
  /* Wellenlinie: hellblaue Abstufungen */
  --w1:#7DB8F7; --w2:#A9D3FB; --w3:#D7EBFE;
  --hero-card:#E8F1FB; --wf-b:#D6E7F9; --wf-m:#BFD9F4; --wf-f:#A6C9EF;
  /* Tageslicht (wirkt im Dunkelmodus) */
  --a1:#FFC15E; --a2:#FF7F5B;
  --display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; --dweight:600; --hweight:700; --dscale:.92; --dtrack:-.03em;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-phase="morning"]{ --a1:#FFC15E; --a2:#FF7F5B; }
:root[data-phase="evening"]{ --a1:#7CC4FF; --a2:#9A8CFF; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050608; --stage:#000000; --surface:#0F1217; --fill:#171B22; --thumb:#2A303A;
    --text:#F4F3EE; --text2:#8B909A; --line:#1C2028; --btn-bg:#F4F3EE; --btn-fg:#050608; --hl:var(--a1);
    --hero-bg:#0F1217; --hero-sub:#8B909A;
    --w1:var(--a1); --w2:color-mix(in srgb, var(--a1) 50%, var(--a2)); --w3:var(--a2);
    --hero-card:#0F1A2E; --wf-b:#15264A; --wf-m:#1B3260; --wf-f:#234072;
  }
}
:root[data-theme="dark"]{
  --bg:#050608; --stage:#000000; --surface:#0F1217; --fill:#171B22; --thumb:#2A303A;
  --text:#F4F3EE; --text2:#8B909A; --line:#1C2028; --btn-bg:#F4F3EE; --btn-fg:#050608; --hl:var(--a1);
  --hero-bg:#0F1217; --hero-sub:#8B909A;
  --w1:var(--a1); --w2:color-mix(in srgb, var(--a1) 50%, var(--a2)); --w3:var(--a2);
    --hero-card:#0F1A2E; --wf-b:#15264A; --wf-m:#1B3260; --wf-f:#234072;
}
:root[data-font="fraunces"]{ --display:"Fraunces", ui-serif, "New York", Georgia, serif; --dweight:350; --hweight:350; --dscale:1; --dtrack:-.02em; }
:root[data-font="newsreader"]{ --display:"Newsreader", ui-serif, Georgia, serif; --dweight:400; --hweight:400; --dscale:1.04; --dtrack:-.015em; }
:root[data-font="cormorant"]{ --display:"Cormorant Garamond", ui-serif, Georgia, serif; --dweight:500; --hweight:500; --dscale:1.16; --dtrack:-.01em; }
:root[data-font="jakarta"]{ --display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --dweight:600; --hweight:700; --dscale:.93; --dtrack:-.03em; }
:root[data-font="figtree"]{ --display:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --dweight:600; --hweight:700; --dscale:1; --dtrack:-.025em; }
:root[data-font="inter"]{ --display:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --dweight:600; --hweight:700; --dscale:.97; --dtrack:-.035em; }

html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body{ height:100%; margin:0; }
body{ background:var(--stage); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
*{ box-sizing:border-box; }
button{ font:inherit; color:inherit; }

.stage{ height:100%; display:flex; align-items:center; justify-content:center; }
.app{ position:relative; width:100%; height:100%; max-width:430px; display:flex; flex-direction:column; background:var(--bg); color:var(--text); overflow:hidden; }
/* Dunkle Bühne: im Hellmodus Navy, im Dunkelmodus Schwarz */
.app.immersive{
  --bg:#0F1B36; --surface:#182848; --fill:#1F3156; --thumb:#2B4170;
  --text:#F4F3EE; --text2:#9AA8C2; --line:#23355A; --btn-bg:#F4F3EE; --btn-fg:#0F1B36;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .app.immersive{
    --bg:#050608; --surface:#0F1217; --fill:#171B22; --thumb:#2A303A;
    --text:#F4F3EE; --text2:#8B909A; --line:#1C2028; --btn-bg:#F4F3EE; --btn-fg:#050608;
  }
}
:root[data-theme="dark"] .app.immersive{
  --bg:#050608; --surface:#0F1217; --fill:#171B22; --thumb:#2A303A;
  --text:#F4F3EE; --text2:#8B909A; --line:#1C2028; --btn-bg:#F4F3EE; --btn-fg:#050608;
}
@media (min-width:520px){
  .stage{ padding:20px; }
  .app{ height:min(100%, 880px); border-radius:40px; border:1px solid var(--line); }
}
.screen{ flex:1; overflow-y:auto; padding:26px 20px 30px; -webkit-overflow-scrolling:touch; }
.screen.center{ display:flex; flex-direction:column; }

/* Typografie */
.disp{ font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); }
h1{ font-family:var(--display); font-weight:var(--hweight); letter-spacing:var(--dtrack); font-size:calc(40px*var(--dscale)); line-height:1.08; margin:0 0 12px; }
h2{ font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); font-size:calc(22px*var(--dscale)); line-height:1.2; margin:0 0 4px; }
.q{ font-family:var(--display); font-weight:var(--hweight); letter-spacing:var(--dtrack); font-size:calc(38px*var(--dscale)); line-height:1.12; margin:8px 0 26px; }
.sub{ color:var(--text2); font-size:16px; line-height:1.45; margin:0 0 24px; letter-spacing:-.01em; }
.small{ color:var(--text2); font-size:13px; line-height:1.45; }
.pl{ font-size:12px; color:var(--text2); margin-top:6px; }

/* Gruppierte Listen (wie iOS) */
.list{ background:var(--surface); border-radius:20px; overflow:hidden; margin-bottom:22px; }
.row{ padding:16px 18px; border-bottom:1px solid var(--line); }
.row:last-child{ border-bottom:0; }
.row .title{ font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); font-size:calc(20px*var(--dscale)); line-height:1.25; }
.row .meta{ color:var(--text2); font-size:13px; margin-top:3px; line-height:1.45; }
.row .acts{ display:flex; gap:18px; margin-top:8px; }
.link{ background:none; border:0; padding:4px 0; color:var(--text2); font-size:14px; cursor:pointer; }
.link:hover{ color:var(--text); }
.link.on{ color:var(--text); font-weight:600; }
.nav-row{ all:unset; box-sizing:border-box; display:flex; width:100%; justify-content:space-between; align-items:center; padding:18px; cursor:pointer; border-bottom:1px solid var(--line); }
.nav-row:last-child{ border-bottom:0; }
.nav-row.hl{ box-shadow:inset 3px 0 0 var(--hl); }
.nav-row:focus-visible{ outline:2px solid var(--text); outline-offset:-2px; }
.chev{ width:18px; height:18px; fill:none; stroke:var(--text2); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

/* Karten nur für Wichtiges */
.card{ background:var(--surface); border-radius:24px; padding:22px 20px; margin-bottom:14px; }
.quote{ font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); font-size:calc(28px*var(--dscale)); line-height:1.25; margin:0; }

/* Buttons */
.btn{ display:block; width:100%; border:0; border-radius:999px; padding:17px 22px; cursor:pointer; background:var(--btn-bg); color:var(--btn-fg); font-weight:600; font-size:16px; letter-spacing:-.01em; text-align:center; }
.btn:disabled{ opacity:.35; cursor:default; }
.btn.ghost{ background:var(--fill); color:var(--text); font-weight:500; }
.btn.sm{ padding:10px 18px; font-size:14px; display:inline-block; width:auto; }
.btn-text{ background:none; border:0; color:var(--text2); font-size:15px; padding:12px; cursor:pointer; width:100%; }
:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
.actions{ margin-top:auto; padding-top:22px; }

/* Eingaben */
textarea, input[type=text], input[type=url]{
  width:100%; background:var(--surface); color:var(--text); border:1px solid var(--line);
  border-radius:16px; padding:14px 16px; font:inherit; font-size:17px; line-height:1.45; resize:none;
}
textarea{ min-height:120px; }
textarea::placeholder, input::placeholder{ color:var(--text2); opacity:.8; }
label.lbl{ display:block; font-size:13px; color:var(--text2); margin:16px 0 7px; }

/* Chips / Segmente */
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:0; background:var(--fill); border-radius:999px; padding:10px 16px; font-size:15px; cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--btn-bg); color:var(--btn-fg); font-weight:600; }
.chip.big{ width:100%; border-radius:20px; padding:20px; text-align:left; font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); font-size:calc(22px*var(--dscale)); background:var(--surface); color:var(--text); }
.chip.big[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--text); }
.stack{ display:flex; flex-direction:column; gap:10px; }
.seg{ display:flex; background:var(--fill); border-radius:12px; padding:3px; margin-bottom:22px; }
.seg button{ flex:1; border:0; background:none; padding:9px 6px; border-radius:9px; font-size:14px; cursor:pointer; color:var(--text2); }
.seg button[aria-pressed="true"]{ background:var(--thumb); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.14); }

/* Tabbar */
.tabbar{ display:flex; border-top:1px solid var(--line); background:var(--bg); padding:8px 4px 8px; }
.tab{ flex:1; background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0 6px; font-size:11px; color:var(--text2); cursor:pointer; position:relative; }
.tab svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.tab[aria-current="page"]{ color:var(--text); font-weight:600; }
.tab[aria-current="page"]::after{ content:""; position:absolute; bottom:-3px; width:4px; height:4px; background:var(--hl); border-radius:50%; }

/* Kopfzeile / Icons */
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:40px; }
.icon-btn{ background:none; border:0; width:40px; height:40px; border-radius:50%; cursor:pointer; color:var(--text2); display:grid; place-items:center; }
.icon-btn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

/* Startseite: helle Karte mit weichen Wellen */
.hero{ margin:0 0 22px; padding:14px 22px 0; background:var(--hero-card); border-radius:30px; overflow:hidden; }
.hero .top{ margin-bottom:16px; }
.hero h1{ margin:0 0 6px; font-size:calc(44px*var(--dscale)); }
.hero .sub{ margin:0; }
.hero svg.wave{ display:block; width:calc(100% + 44px); margin:14px -22px 0; height:110px; }
.fb{ fill:var(--wf-b); }
.fm{ fill:var(--wf-m); }
.ff{ fill:var(--wf-f); }

/* Linienwellen (Atemmoment) */
.w1,.w2,.w3{ fill:none; stroke-linecap:round; vector-effect:non-scaling-stroke; stroke:url(#wg); }
.w1{ stroke-width:2.5; }
.w2{ stroke-width:1.2; opacity:.4; }
.w3{ stroke-width:1.8; opacity:.65; }

/* Atemlinie */
.breath{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:18px; }
.breath svg{ width:calc(100% + 40px); margin:0 -20px; height:220px; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--w1) 50%, transparent)); }
.breath-label{ font-family:var(--display); font-weight:var(--dweight); font-size:calc(26px*var(--dscale)); color:var(--text2); min-height:36px; letter-spacing:var(--dtrack); }

/* Abschluss */
.done{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; }
.done svg{ width:260px; height:30px; filter:drop-shadow(0 0 6px color-mix(in srgb, var(--w1) 50%, transparent)); }
.done path{ fill:none; stroke:url(#wg); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:370; stroke-dashoffset:370; animation:draw 1.2s ease .1s forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* Tagebuch */
.entry{ padding:18px; border-bottom:1px solid var(--line); }
.entry:last-child{ border-bottom:0; }
.entry .when{ color:var(--text2); font-size:13px; margin-bottom:8px; }
.entry p{ margin:0 0 6px; font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); font-size:calc(20px*var(--dscale)); line-height:1.4; }
.entry p.mut{ color:var(--text2); font-size:calc(17px*var(--dscale)); }
.tag{ font-size:12px; color:var(--text2); background:var(--fill); border-radius:999px; padding:2px 9px; margin-left:8px; }

details{ margin-top:20px; }
summary{ cursor:pointer; color:var(--text2); font-size:15px; padding:6px 0; }

/* Schriftauswahl */
.pick-row{ display:flex; align-items:center; gap:14px; padding:15px 18px; border:0; border-bottom:1px solid var(--line); background:none; width:100%; text-align:left; cursor:pointer; }
.pick-row:last-child{ border-bottom:0; }
.pick-row[aria-checked="true"] .box{ background:var(--text); border-color:var(--text); }
.pick-row[aria-checked="true"] .box::after{ content:""; width:8px; height:4px; border-left:2px solid var(--bg); border-bottom:2px solid var(--bg); transform:rotate(-45deg) translate(1px,-1px); }

/* Training */
.setrow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
.setrow .sn{ width:16px; color:var(--text2); font-size:13px; flex:none; }
.stp{ display:flex; align-items:center; gap:4px; }
.stp .sb{ all:unset; box-sizing:border-box; width:28px; height:28px; border-radius:50%; background:var(--fill); display:grid; place-items:center; cursor:pointer; font-size:17px; line-height:1; flex:none; }
.stp .sb:focus-visible, .sdone:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
.stp .sv{ min-width:52px; text-align:center; font-weight:600; font-size:15px; }
.stp.r .sv{ min-width:38px; }
.stp .su{ font-size:11px; color:var(--text2); font-weight:400; }
.sdone{ all:unset; box-sizing:border-box; width:26px; height:26px; border:1.5px solid var(--text2); border-radius:50%; cursor:pointer; flex:none; display:grid; place-items:center; margin-left:auto; }
.sdone[aria-checked="true"]{ background:var(--text); border-color:var(--text); }
.sdone[aria-checked="true"]::after{ content:""; width:9px; height:4px; border-left:2px solid var(--bg); border-bottom:2px solid var(--bg); transform:rotate(-45deg) translate(1px,-1px); }

/* Satz mit Vergleichszeile */
.setwrap{ border-top:1px solid var(--line); padding:8px 0; }
.setwrap .setrow{ border-top:0; padding:0; }
.setref{ margin:5px 0 0 24px; }

/* Aufgaben */
.task{ display:flex; align-items:center; gap:14px; padding:13px 18px; border-bottom:1px solid var(--line); }
.task:last-child{ border-bottom:0; }
.task .tbox{ all:unset; box-sizing:border-box; width:24px; height:24px; border:1.5px solid var(--text2); border-radius:50%; cursor:pointer; flex:none; display:grid; place-items:center; }
.task[data-done="true"] .tbox{ background:var(--text); border-color:var(--text); }
.task[data-done="true"] .tbox::after{ content:""; width:9px; height:4px; border-left:2px solid var(--bg); border-bottom:2px solid var(--bg); transform:rotate(-45deg) translate(1px,-1px); }
.task .tl{ flex:1; font-size:16px; line-height:1.35; }
.task[data-done="true"] .tl{ color:var(--text2); text-decoration:line-through; }
.task .tx{ all:unset; box-sizing:border-box; cursor:pointer; color:var(--text2); width:32px; height:32px; display:grid; place-items:center; border-radius:50%; }
.task .tx svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; }
.task .tbox:focus-visible, .task .tx:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

/* Kacheln (Küche) */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
.tile{ all:unset; box-sizing:border-box; position:relative; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; padding:16px 16px 0; background:var(--surface); border-radius:22px; overflow:hidden; cursor:pointer; }
.tile:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
.tile .tcats{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; padding-right:24px; }
.tile .tc{ font-size:11px; background:var(--fill); color:var(--text2); border-radius:999px; padding:2px 8px; }
.tile .tn{ font-family:var(--display); font-weight:var(--dweight); letter-spacing:var(--dtrack); font-size:calc(21px*var(--dscale)); line-height:1.15; }
.tile .tm{ color:var(--text2); font-size:12px; margin-top:6px; line-height:1.35; }
.tile svg.tw{ display:block; width:calc(100% + 32px); margin:12px -16px 0; height:22px; }
.tile svg.tw path{ fill:var(--wf-b); }
.tile .badge{ position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:50%; background:var(--text); display:grid; place-items:center; }
.tile .badge::after{ content:""; width:8px; height:4px; border-left:2px solid var(--bg); border-bottom:2px solid var(--bg); transform:rotate(-45deg) translate(1px,-1px); }
.pill{ display:inline-block; font-size:13px; background:var(--fill); color:var(--text); border-radius:999px; padding:5px 12px; margin:0 6px 6px 0; }

/* Einkauf */
.check-row{ display:flex; align-items:center; gap:14px; padding:15px 18px; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; }
.check-row:last-child{ border-bottom:0; }
.box{ width:22px; height:22px; border:1.5px solid var(--text2); border-radius:50%; flex:none; display:grid; place-items:center; }
.check-row[aria-checked="true"] .box{ background:var(--text); border-color:var(--text); }
.check-row[aria-checked="true"] .lab{ color:var(--text2); text-decoration:line-through; }
.check-row[aria-checked="true"] .box::after{ content:""; width:8px; height:4px; border-left:2px solid var(--bg); border-bottom:2px solid var(--bg); transform:rotate(-45deg) translate(1px,-1px); }

/* Toast + Banner */
.toast{ position:absolute; left:50%; bottom:86px; transform:translate(-50%, 12px); opacity:0; background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; transition:opacity .25s, transform .25s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; transform:translate(-50%, 0); }
.banner{ position:absolute; left:10px; right:10px; top:10px; z-index:9; background:var(--surface); border-radius:22px; padding:12px 16px; box-shadow:0 10px 30px rgba(10,20,45,.25); transform:translateY(-140%); transition:transform .45s cubic-bezier(.2,.8,.2,1); }
.banner.on{ transform:translateY(0); }
.banner .who{ display:flex; justify-content:space-between; font-size:12px; color:var(--text2); margin-bottom:3px; }
.banner .msg{ font-size:15px; line-height:1.35; }
.protobar{ font-size:12px; color:var(--text2); text-align:center; padding:12px 0 0; line-height:1.5; }

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
  .done path{ stroke-dashoffset:0; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0"><stop offset="0" style="stop-color:var(--w1)"/><stop offset="0.5" style="stop-color:var(--w2)"/><stop offset="1" style="stop-color:var(--w3)"/></linearGradient></defs></svg>
<div class="stage">
  <div class="app" id="app">
    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="screen" id="screen"></div>
    <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- Helfer ---------- */
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

/* ---------- Wellenlinie (Markenmotiv) ---------- */
function wavePath(W,H,amp,k,phase,step){
  var d='';
  for(var x=0;x<=W;x+=step){
    var env=Math.pow(Math.sin(Math.PI*x/W),0.75);
    var y=H/2+amp*env*Math.sin(k*x+phase);
    d+=(x===0?'M':'L')+x+' '+y.toFixed(1);
  }
  return d;
}
function fillPath(W,H,base,amp,k,phase,step){
  var d='M0 '+H;
  for(var x=0;x<=W;x+=step){ d+=' L'+x+' '+(base+amp*Math.sin(k*x+phase)).toFixed(1); }
  return d+' L'+W+' '+H+' Z';
}
function heroLoop(){
  var f=$('#hw1'), m=$('#hw2'), b=$('#hw3'); if(!f||!m||!b) return;
  var W=400,H=110;
  function draw(t){
    b.setAttribute('d',fillPath(W,H,44,9,0.021,t*0.20+1,6));
    m.setAttribute('d',fillPath(W,H,62,10,0.027,-t*0.26+3,6));
    f.setAttribute('d',fillPath(W,H,80,9,0.033,t*0.32+5,6));
  }
  if(reduce){ draw(1); return; }
  var t0=performance.now();
  (function frame(now){
    if(!document.body.contains(f)) return;
    draw((now-t0)/1000);
    ui.raf=requestAnimationFrame(frame);
  })(t0);
}
function breathHTML(){
  return '<div class="breath"><div class="breath-label" id="breathLabel" aria-live="polite">&nbsp;</div>'+
    '<svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true"><path id="wv2" class="w2"/><path id="wv3" class="w3"/><path id="wv1" class="w1"/></svg></div>';
}
function runBreath(seconds, onDone){
  var p1=$('#wv1'), p2=$('#wv2'), p3=$('#wv3'), lab=$('#breathLabel'); if(!p1||!p2||!p3) return;
  var W=400,H=200;
  function draw(amp,t){
    p1.setAttribute('d',wavePath(W,H,64*amp,0.045,t*1.5,4));
    p2.setAttribute('d',wavePath(W,H,36*amp,0.07,-t*1.1+1,4));
    p3.setAttribute('d',wavePath(W,H,48*amp,0.055,t*0.8+3,4));
  }
  draw(0,0);
  if(reduce){
    draw(0.55,0.4);
    var left=seconds; lab.textContent='Noch '+left+' Sekunden';
    (function tick(){
      later(function(){
        left--;
        if(left<=0){ lab.textContent='Gut.'; draw(0,0); chime(); if(onDone) onDone(); }
        else { lab.textContent='Noch '+left+' Sekunden'; tick(); }
      },1000);
    })();
    return;
  }
  var start=performance.now();
  lab.textContent='Einatmen';
  (function frame(now){
    if(!document.body.contains(p1)) return;
    var t=(now-start)/1000, p=Math.min(t/seconds,1);
    var sN=Math.pow(Math.sin(Math.PI*p),0.9);
    draw(sN,t);
    lab.textContent = p<0.5 ? 'Einatmen' : 'Ausatmen';
    if(p<1){ ui.raf=requestAnimationFrame(frame); }
    else { lab.textContent='Gut.'; draw(0,0); chime(); if(onDone) onDone(); }
  })(start);
}

/* ---------- Rendering ---------- */
function tabbar(){
  var tabs=[['home','Heute',ICON.heute],['vors','Vorsätze',ICON.vors],['kueche','Küche',ICON.kueche],['conn','Connection',ICON.conn],['insp','Inspiration',ICON.insp]];
  var el=$('#tabbar');
  if(ui.flow || (ui.view==='stille' && ui.stille.stage==='run') || trainFocus()){ el.style.display='none'; return; }
  el.style.display='flex';
  var cur=(ui.view==='rueck'||ui.view==='settings'||ui.view==='stille'||ui.view==='train')?'home':ui.view;
  el.innerHTML=tabs.map(function(t){
    return '<button class="tab" data-act="tab" data-v="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+t[2]+'<span>'+t[1]+'</span></button>';
  }).join('');
}
function render(){
  clearTimers();
  if(drone && !(ui.view==='stille' && ui.stille.stage==='run')) stopDrone(true);
  var s=$('#screen'); s.classList.remove('center');
  $('#app').classList.toggle('immersive', !!ui.flow || ui.view==='insp' || ui.view==='stille' || trainFocus());
  var html='';
  if(ui.flow){ s.classList.add('center'); html=renderFlow(); }
  else if(ui.view==='home') html=renderHome();
  else if(ui.view==='vors') html=renderIntentions();
  else if(ui.view==='kueche') html=renderKueche();
  else if(ui.view==='conn') html=renderConn();
  else if(ui.view==='rueck') html=renderReview();
  else if(ui.view==='insp'){ html=renderInspo(); if(['ask','breath','show'].indexOf(ui.inspo.stage)>-1) s.classList.add('center'); }
  else if(ui.view==='settings') html=renderSettings();
  else if(ui.view==='train'){ html=renderTrain(); if(ui.train.stage==='done') s.classList.add('center'); }
  else if(ui.view==='stille'){ html=renderStille(); if(ui.stille.stage==='run') s.classList.add('center'); }
  s.innerHTML=html; s.scrollTop=ui.keepScroll||0; ui.keepScroll=0;
  tabbar(); afterRender();
}
function keepFields(fn){
  var vals={};
  document.querySelectorAll('#screen input[type=text], #screen input[type=url], #screen textarea').forEach(function(e){ if(e.id) vals[e.id]=e.value; });
  fn();
  Object.keys(vals).forEach(function(id){ var e=document.getElementById(id); if(e) e.value=vals[id]; });
}
function afterRender(){
  if(ui.flow && ui.flow.step==='breath') runBreath(4, null);
  else if(ui.flow && ui.flow.step==='done') later(function(){ ui.flow=null; ui.view='home'; render(); }, 3400);
  else if(!ui.flow && ui.view==='home') heroLoop();
  else if(!ui.flow && ui.view==='stille' && ui.stille.stage==='run') runStille();
  else if(!ui.flow && ui.view==='train' && ui.train.stage==='done') later(function(){ ui.view='home'; ui.train.stage='home'; ui.train.session=null; render(); }, 3200);
  else if(!ui.flow && ui.view==='insp' && ui.inspo.stage==='breath') runBreath(5, function(){ var b=$('#inspGo'); if(b) b.disabled=false; });
  var f=document.querySelector('[data-focus]'); if(f && !('ontouchstart' in window)) f.focus();
}

    if(f.step==='done') return doneHTML('Gute Nacht.');
  }

}

/* Küche */
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function ingKey(s){ return norm(s); }
function lines(t){ return String(t||'').split('\n').map(function(z){ return z.trim(); }).filter(Boolean); }
function searchTerms(q){ return String(q||'').split(',').map(norm).filter(Boolean); }
function matchDish(d,terms){
  var found=[];
  for(var i=0;i<terms.length;i++){
    var t=terms[i], hit=null, a, b;
    for(a=0;a<d.zutaten.length && hit===null;a++){ if(norm(d.zutaten[a]).indexOf(t)>-1) hit=d.zutaten[a]; }
    for(b=0;b<(d.optional||[]).length && hit===null;b++){ if(norm(d.optional[b]).indexOf(t)>-1) hit=d.optional[b]+' (optional)'; }
    if(hit===null && norm(d.name).indexOf(t)>-1) hit='';
    if(hit===null) return null;
    if(hit) found.push(hit);
  }
  return found;
}
function visibleDishes(){
  var k=ui.kueche, terms=searchTerms(k.q), out=[];
  store.dishes.forEach(function(d){
    if(k.catFilter && (d.cats||[]).indexOf(k.catFilter)<0) return;
    var m=matchDish(d,terms); if(m===null) return;
    out.push({d:d, m:m});
  });
  return out;
}
function emptyMsgK(){ return store.dishes.length ? 'Kein Gericht passt dazu.' : 'Noch kein Gericht. Was kochst du gern?'; }
function tileHTML(d,m){
  var cats=(d.cats||[]);
  var shown=cats.slice(0,2).map(function(c){ return '<span class="tc">'+esc(c)+'</span>'; }).join('')+(cats.length>2?'<span class="tc">+'+(cats.length-2)+'</span>':'');
  var meta=[d.aufwand,d.anlass].filter(Boolean).join(', ');
  var info=(m && m.length)?'<div class="tm">mit '+esc(m.join(', '))+'</div>':'';
  return '<button class="tile" data-act="kOpen" data-id="'+d.id+'" aria-label="'+esc(d.name)+'">'+
    (ui.kueche.sel[d.id]?'<span class="badge" title="Auf der Einkaufsliste"></span>':'')+
    '<div><div class="tcats">'+shown+'</div><div class="tn">'+esc(d.name)+'</div><div class="tm">'+esc(meta)+'</div>'+info+'</div>'+
    '<svg class="tw" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 Q12.5 2 25 10 T50 10 T75 10 T100 10 V22 H0Z"/></svg></button>';
}
function tilesGrid(list,emptyMsg){
  if(!list.length) return '<p class="sub">'+esc(emptyMsg)+'</p>';
  return '<div class="tiles">'+list.map(function(x){ return tileHTML(x.d,x.m); }).join('')+'</div>';
}
function chipsHTML(list, cur, act){
  return list.map(function(n){ return '<button class="chip" data-act="'+act+'" data-n="'+esc(n)+'" aria-pressed="'+(cur===n)+'">'+esc(n)+'</button>'; }).join('');
}
function chipsMulti(list, arr, act){
  return list.map(function(n){ return '<button class="chip" data-act="'+act+'" data-n="'+esc(n)+'" aria-pressed="'+(arr.indexOf(n)>-1)+'">'+esc(n)+'</button>'; }).join('');
}
function shoppingData(){
  var seen={}, main=[], opt=[];
  store.dishes.forEach(function(d){ if(!ui.kueche.sel[d.id]) return;
    d.zutaten.forEach(function(z){ var key=ingKey(z); if(key && !seen[key]){ seen[key]=1; main.push(z.trim()); } });
  });
  store.dishes.forEach(function(d){ if(!ui.kueche.sel[d.id]) return;
    (d.optional||[]).forEach(function(z){ var key=ingKey(z); if(key && !seen[key]){ seen[key]=1; opt.push(z.trim()); } });
  });
  return {main:main, opt:opt};
}
function checkRows(list){
  return '<div class="list">'+list.map(function(z){
    var c=!!ui.kueche.checked[ingKey(z)];
    return '<button class="check-row" role="checkbox" aria-checked="'+c+'" data-act="kCheck" data-key="'+esc(ingKey(z))+'"><span class="box"></span><span class="lab">'+esc(z)+'</span></button>';

  var sd=shoppingData();

/* ---------- Klänge ---------- */
var actx=null;
function ensureAudio(){
  try{ if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){}
}
function tone(freq,dur,vol){
  if(!store || !store.settings.sound || !actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime;
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.25);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function chime(){ tone(392,2.2,0.05); setTimeout(function(){ tone(523.25,2.6,0.035); },350); }

/* ---------- Grundklang (Stille, Huberman) ---------- */
var drone=null;
function startDrone(){
  stopDrone(true);
  ensureAudio(); if(!actx) return;
  try{
    var t0=actx.currentTime, master=actx.createGain(), oscs=[];
    master.gain.setValueAtTime(0.0001,t0); master.gain.exponentialRampToValueAtTime(0.12,t0+5); master.connect(actx.destination);
    [[110,0.5],[164.81,0.32],[220,0.22],[329.63,0.1]].forEach(function(x,i){
      var o=actx.createOscillator(), g=actx.createGain(), lfo=actx.createOscillator(), lg=actx.createGain();
      o.type='sine'; o.frequency.value=x[0]; g.gain.value=x[1];
      lfo.type='sine'; lfo.frequency.value=0.05+i*0.017; lg.gain.value=x[1]*0.5;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(master); o.start(); lfo.start(); oscs.push(o,lfo);
    });
    drone={master:master, oscs:oscs};
  }catch(e){}
}
function stopDrone(fast){
  if(!drone) return; var d=drone; drone=null;
  try{
    var t=actx.currentTime, len=fast?0.05:4;
    var cur=Math.max(d.master.gain.value,0.0001);
    d.master.gain.cancelScheduledValues(t); d.master.gain.setValueAtTime(cur,t); d.master.gain.exponentialRampToValueAtTime(0.0001,t+len);
    d.oscs.forEach(function(o){ try{ o.stop(t+len+0.2); }catch(e){} });
  }catch(e){}
}

var RHYTHMS={
  stille:{name:'Nur Stille', note:'Kein Rhythmus, nur da sein', p:null},
  huberman:{name:'Huberman', note:'Meditativer Grundklang. Du atmest in deinem eigenen Tempo.', p:null},
  box:{name:'Box', note:'4 ein, 4 halten, 4 aus, 4 halten', p:[['Einatmen',4],['Halten',4],['Ausatmen',4],['Halten',4]]},
  eigen:{name:'Eigener', note:'Du legst die Zeiten selbst fest', p:'custom'}
};
function phasesFor(key){
  if(key==='eigen'){
    var c=ui.stille.custom, arr=[];
    if(c.in>0) arr.push(['Einatmen',c.in]);
    if(c.h1>0) arr.push(['Halten',c.h1]);
    if(c.out>0) arr.push(['Ausatmen',c.out]);
    if(c.h2>0) arr.push(['Halten',c.h2]);
    return arr.length ? arr : [['Einatmen',4],['Ausatmen',4]];
  }
  return RHYTHMS[key].p;
}
function amplitudeAt(phases,t){
  var total=phases.reduce(function(a,p){ return a+p[1]; },0), x=t%total, acc=0, cur=0;
  for(var i=0;i<phases.length;i++){
    var name=phases[i][0], d=phases[i][1];
    if(x<acc+d){
      var f=(x-acc)/d, e=f<0.5 ? 2*f*f : 1-Math.pow(-2*f+2,2)/2;
      if(name==='Einatmen') return {a:e, label:name};
      if(name==='Ausatmen') return {a:1-e, label:name};
      return {a:cur, label:name};
    }
    if(name==='Einatmen') cur=1; else if(name==='Ausatmen') cur=0;
    acc+=d;
  }
  return {a:0, label:''};
}
function renderStille(){
  var st=ui.stille;
  if(st.stage==='run'){

  }
  var rows=Object.keys(RHYTHMS).map(function(k){

    return '<button class="pick-row" role="radio" aria-checked="'+(st.rhythm===k)+'" data-act="stR" data-v="'+k+'"><span class="box"></span><span style="flex:1"><span style="display:block;font-weight:600;font-size:17px">'+r.name+'</span><span class="small" style="display:block;margin-top:2px">'+r.note+'</span></span></button>';
  }).join('');

    }).join('')+'</div>';

  return '<div class="top"><button class="icon-btn" data-act="tab" data-v="home" aria-label="Zurück">'+ICON.back+'</button><span></span></div>'+
    '<h1>Stille</h1><p class="sub">Atmen und einfach da sein. Ohne Ziel, ohne Zähler.</p>'+
    '<label class="lbl" style="margin-top:0">Rhythmus</label><div class="list" role="radiogroup" aria-label="Rhythmus">'+rows+'</div>'+steppers+
    '<label class="lbl">Dauer</label><div class="chips">'+mins+'</div>'+
    '<div style="margin-top:28px"><button class="btn" data-act="stGo">Beginnen</button></div>'+
    '<p class="protobar">Es wird nichts gespeichert und nichts gezählt.</p>';

function runStille(){
  var st=ui.stille, W=400, H=200;
  var p1=$('#wv1'), p2=$('#wv2'), p3=$('#wv3'), lab=$('#stLabel'), tm=$('#stTime');
  if(!p1||!p2||!p3||!lab||!tm) return;
  var free = (st.rhythm==='stille' || st.rhythm==='huberman');
  var phases = free ? null : phasesFor(st.rhythm);
  var total=st.minutes*60, start=performance.now(), lastLabel=null, finished=false;
  function draw(a,t){
    p1.setAttribute('d',wavePath(W,H,64*a,0.045,t*1.5,4));
    p2.setAttribute('d',wavePath(W,H,36*a,0.07,-t*1.1+1,4));
    p3.setAttribute('d',wavePath(W,H,48*a,0.055,t*0.8+3,4));
  }
  function timeText(t){
    if(!st.showTime){ tm.textContent=''; return; }
    var left=Math.max(0,Math.ceil(total-t)), m=Math.floor(left/60), sec=left%60;
    tm.textContent='Noch '+m+':'+(sec<10?'0':'')+sec;
  }
  function finish(){
    finished=true; stopDrone(false); draw(0,0); lab.textContent='Gut.'; tm.textContent=''; chime();
    later(function(){ ui.view='home'; ui.stille.stage='setup'; render(); }, 2800);
  }
  function step(now){
    if(finished || !document.body.contains(p1)) return;
    var t=(now-start)/1000;
    if(t>=total){ finish(); return; }
    var a, label;
    if(phases){ var r=amplitudeAt(phases,t); a=r.a; label=r.label; }
    else if(st.rhythm==='huberman'){ a=0.3+0.16*Math.sin(t*0.42)+0.08*Math.sin(t*0.27+1.3); label=(t<10)?'In deinem Tempo':''; }
    else { a=0.06+0.04*Math.sin(t*0.25); label='Nur da sein'; }
    if(reduce) a = phases ? 0.35 : (st.rhythm==='huberman' ? 0.3 : 0.05);
    draw(a, reduce?0:t);
    if(label!==lastLabel){
      lastLabel=label; lab.textContent=label;
      if(phases && store.settings.phaseTones){
        if(label==='Einatmen') tone(330,1.2,0.03); else if(label==='Ausatmen') tone(262,1.4,0.03);
      }
    }
    timeText(t);
    if(reduce) later(function(){ step(performance.now()); },250); else ui.raf=requestAnimationFrame(step);
  }
  step(start);
}

function trainFocus(){ if(ui.view!=='train') return false; var g=ui.train.stage; return g==='session'||g==='pick'||g==='done'||(g==='exdetail' && ui.train.ret==='session'); }
function fmtNum(n){ return String(Math.round(n*100)/100).replace('.',','); }
function exById(id){ return store.exercises.filter(function(e){ return e.id===id; })[0]; }
function exSafe(id){ return exById(id) || {id:id, name:'Gelöschte Übung', step:2.5, bw:false}; }
var MGS=['Brust','Rücken','Schultern','Bizeps','Trizeps','Beine','Bauch'];
function weekStart(back){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)-7*(back||0)); return d.getTime(); }
function workingCount(sets){
  if(!sets || !sets.length) return 0;
  var ww=workWeight(sets);
  return sets.filter(function(x){ return x.w===ww; }).length;
}
function weekSetsFor(mg,back){
  back=back||0;
  var ws=weekStart(back), we=back?weekStart(back-1):Infinity, n=0, ses=ui.train.session;
  store.sessions.forEach(function(se){
    if(se.ts<ws || se.ts>=we) return;
    se.items.forEach(function(it){ var ex=exById(it.exId); if(ex && ex.mg===mg) n+=workingCount(it.sets); });
  });
  if(!back && ses && ui.train.stage!=='done') ses.items.forEach(function(it){
    var ex=exById(it.exId); if(!ex || ex.mg!==mg) return;
    n+=workingCount(it.sets.filter(function(x){ return x.done; }));
  });
  return n;
}
function guideText(){ return store.settings.wkOn ? 'Richtwert '+store.settings.wkMin+' bis '+store.settings.wkMax : ''; }
function lastFor(exId){
  var list=store.sessions.slice().sort(function(a,b){ return b.ts-a.ts; });
  for(var i=0;i<list.length;i++){
    for(var j=0;j<list[i].items.length;j++){
      if(list[i].items[j].exId===exId && list[i].items[j].sets.length) return {sets:list[i].items[j].sets, ts:list[i].ts};
    }
  }
  return null;
}
function lastSetsFor(exId){ var l=lastFor(exId); return l?l.sets:null; }
function fmtInt(n){ return Math.round(n).toLocaleString('de-DE'); }
function segG(items,cur,act){
  return '<div class="chips" role="group">'+items.map(function(x){ var q=x.split(':'); return '<button class="chip" data-act="'+act+'" data-v="'+q[0]+'" aria-pressed="'+(cur===q[0])+'">'+q[1]+'</button>'; }).join('')+'</div>';
}
function sessLoad(ex,sets){
  /* Load = Schnitt pro Arbeitssatz (Gewicht x Wiederholungen). Arbeitssätze = Sätze mit dem Arbeitsgewicht,
     so verzerren weder Aufwärmsätze noch eine unterschiedliche Satzzahl den Vergleich. */
  if(!sets || !sets.length) return 0;
  var ww=workWeight(sets), ws=sets.filter(function(x){ return x.w===ww; });
  var kg=store.settings.bodyKg>0 ? store.settings.bodyKg : 0;
  var sum=ws.reduce(function(a,st){
    if(ex.bw && !kg) return a+st.r;
    return a+((ex.bw?kg+st.w:st.w)*st.r);
  },0);
  return sum/ws.length;
}
function workWeight(sets){
  /* Arbeitsgewicht = am häufigsten genutztes Gewicht (bei Gleichstand das höhere) */
  var cnt={}, best=null;
  sets.forEach(function(x){ cnt[x.w]=(cnt[x.w]||0)+1; });
  Object.keys(cnt).forEach(function(k){
    var w=parseFloat(k);
    if(best===null || cnt[k]>cnt[best] || (cnt[k]===cnt[best] && w>parseFloat(best))) best=k;
  });
  return parseFloat(best);
}
function loadUnit(ex){ return (ex.bw && !(store.settings.bodyKg>0)) ? 'Wdh.' : 'kg × Wdh.'; }
function wtLabel(ex,w){ return ex.bw ? (w>0 ? '+'+fmtNum(w)+' kg' : 'Körpergewicht') : fmtNum(w)+' kg'; }
function setsText(ex,sets){
  var same=sets.every(function(s){ return s.w===sets[0].w; });
  if(same) return wtLabel(ex,sets[0].w)+' × '+sets.map(function(s){ return s.r; }).join(', ');
  return sets.map(function(s){ return fmtNum(s.w)+'×'+s.r; }).join(', ');
}
function ruleSuggest(ex,last){
  if(!last || !last.length) return null;
  var w=workWeight(last);
  var at=last.filter(function(x){ return x.w===w; });
  var minR=Math.min.apply(null,at.map(function(x){ return x.r; }));
  if(ex.repMax && at.every(function(x){ return x.r>=ex.repMax; })){

    return '<div class="card"><h2>'+esc(ex.name)+'</h2>'+
      (last?'<div class="small">Letztes Mal: '+esc(setsText(ex,last))+'</div>':'<div class="small">Noch keine Werte. Dein erster Eintrag ist dein Startpunkt.</div>')+
      ((sg && store.settings.hints!==false)?'<div class="small">Vorschlag für jeden Satz: '+esc(ex.bw?(sg.w>0?'+'+fmtNum(sg.w)+' kg':'Körpergewicht'):fmtNum(sg.w)+' kg')+' × '+sg.r+(sg.pct>0.05?'. Im Schnitt pro Satz sind das etwa +'+fmtNum(Math.round(sg.pct*10)/10)+' % gegenüber letztem Mal.':'')+'</div>':'')+
      (ex.mg?'<div class="small">'+esc(ex.mg)+' diese Woche: '+weekSetsFor(ex.mg)+' Sätze, letzte Woche: '+weekSetsFor(ex.mg,1)+(store.settings.wkOn?' ('+guideText()+')':'')+'</div>':'')+
      (ex.bw?'<div class="small">Das Gewicht ist ein Zusatz zum Körpergewicht.</div>':'')+
      '<div style="margin-top:10px">'+rows+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px"><button class="link" data-act="tAddSet" data-i="'+ii+'">Satz hinzufügen</button>'+
      (it.sets.length>1?'<button class="link" data-act="tDelSet" data-i="'+ii+'">Letzten Satz entfernen</button>':'')+
      '<button class="link" data-act="tExDetail" data-id="'+ex.id+'" data-ret="session">Verlauf</button><button class="link" data-act="tDelEx" data-i="'+ii+'">Übung entfernen</button></div></div>';
  }).join('');
  return '<div class="top"><button class="icon-btn" data-act="tCancel" aria-label="Abbrechen">'+ICON.close+'</button><span class="small">'+esc(fmtDate(Date.now()))+'</span></div>'+
    '<h1>'+esc(ses.name)+'</h1>'+
    (cards||'<p class="sub">Noch keine Übung. Füge unten eine hinzu.</p>')+
    '<button class="btn ghost" data-act="tPickOpen" style="margin-bottom:10px">Übung hinzufügen</button>'+
    '<button class="btn" data-act="tFinish">Training beenden</button>'+
    '<p class="protobar">Gespeichert werden nur die Sätze, die du abgehakt hast. Aufwärmsätze lässt du einfach aus.</p>';
}

/* ---------- Aktionen ---------- */
function startFlow(kind){ ui.flow={ kind:kind, step:'breath', data:{ kindImpulse:impulseKind(), intentionId:'' } }; render(); }
function order(kind){ return kind==='morning' ? ['breath','impulse','intention','done'] : ['breath','good','letgo','done']; }
function readFields(){
  var f=ui.flow, d=f.data, el;
  if(f.step==='impulse'){ el=$('#f-text'); if(el) d.text=el.value.trim(); }
  if(f.step==='good'){ el=$('#f-good'); if(el) d.good=el.value.trim(); }
  if(f.step==='letgo'){ el=$('#f-letgo'); if(el) d.letGo=el.value.trim(); el=$('#f-stress'); if(el) d.stress=el.value.trim(); }
}
function advance(read){
  var f=ui.flow; if(read) readFields();
  var o=order(f.kind), i=o.indexOf(f.step); f.step=o[i+1];
  if(f.step==='done') finishFlow();
  render();
}
function finishFlow(){
  var f=ui.flow, d=f.data, has=false;
  if(f.kind==='morning'){
    var it=store.intentions.filter(function(x){ return x.id===d.intentionId; })[0];
    if(d.text || it){ store.entries.push({id:uid(), ts:Date.now(), type:'morning', kind:d.kindImpulse, text:d.text||'', intention:it?it.what:''}); has=true; }
  } else if(d.good || d.letGo || d.stress){ store.entries.push({id:uid(), ts:Date.now(), type:'evening', good:d.good||'', letGo:d.letGo||'', stress:d.stress||''}); has=true; }
  if(has) save();
}
function currentPhase(){
  var p=store.settings.phase||'auto';
  if(p==='morning'||p==='evening') return p;
  var h=new Date().getHours(); return (h>=5 && h<16) ? 'morning' : 'evening';
}
function applyTheme(){
  var r=document.documentElement, t=store.settings.theme;
  if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
  var f=store.settings.font; if(f && f!=='manrope') r.setAttribute('data-font',f); else r.removeAttribute('data-font');
  r.setAttribute('data-phase', currentPhase());
}
function toggleFilter(key, val){ ui.kueche[key] = ui.kueche[key]===val ? null : val; ui.kueche.result=null; }

      var body=$('#i-body').value.trim();
      if(!body){ toast('Dein Warum fehlt noch.'); break; }
      var url=$('#i-url').value.trim(); if(url && !/^https?:\/\//i.test(url)) url='';
      store.inspo.push({id:uid(), cat:ui.inspo.newCat||'Ruhe', title:$('#i-title').value.trim(), body:body, url:url});
      save(); ui.inspo={stage:'curate', need:null, newCat:ui.inspo.newCat}; render(); toast('Hinzugefügt.'); break;
    case 'delInsp': store.inspo=store.inspo.filter(function(i){ return i.id!==b.getAttribute('data-id'); }); save(); render(); break;

    case 'mode': ui.keepScroll=$('#screen').scrollTop; store.settings.mode=b.getAttribute('data-v'); save(); render(); break;
    case 'theme': ui.keepScroll=$('#screen').scrollTop; store.settings.theme=b.getAttribute('data-v'); save(); applyTheme(); render(); break;
    case 'font': ui.keepScroll=$('#screen').scrollTop; store.settings.font=b.getAttribute('data-v'); save(); applyTheme(); render(); break;
    case 'phase': ui.keepScroll=$('#screen').scrollTop; store.settings.phase=b.getAttribute('data-v'); save(); applyTheme(); render(); break;
    case 'sound': ui.keepScroll=$('#screen').scrollTop; store.settings.sound=(b.getAttribute('data-v')==='on'); save(); render(); if(store.settings.sound) chime(); break;
    case 'ptone': ui.keepScroll=$('#screen').scrollTop; store.settings.phaseTones=(b.getAttribute('data-v')==='on'); save(); render(); break;
    case 'vac': ui.keepScroll=$('#screen').scrollTop; setVacation(b.getAttribute('data-v')); save(); render(); break;
    case 'stOpen': ui.view='stille'; ui.stille.stage='setup'; render(); break;
    case 'stR': ui.keepScroll=$('#screen').scrollTop; ui.stille.rhythm=b.getAttribute('data-v'); render(); break;
    case 'stC': ui.keepScroll=$('#screen').scrollTop; var ck=b.getAttribute('data-k'), cd=parseInt(b.getAttribute('data-d'),10); ui.stille.custom[ck]=Math.max(0,Math.min(12,ui.stille.custom[ck]+cd)); render(); break;
    case 'stM': ui.keepScroll=$('#screen').scrollTop; ui.stille.minutes=parseInt(b.getAttribute('data-n'),10); render(); break;
    case 'stGo': ui.stille.stage='run'; if(ui.stille.rhythm==='huberman') startDrone(); render(); break;
    case 'stTime': ui.stille.showTime=!ui.stille.showTime; b.textContent=ui.stille.showTime?'Zeit ausblenden':'Zeit zeigen'; break;
    case 'stEnd': stopDrone(true); ui.stille.stage='setup'; render(); break;
    case 'banner':
      if(vacationActive()){ toast('Im Urlaubsmodus kommen keine Benachrichtigungen.'); break; }
      banner(); break;
    case 'reset':
      if(window.confirm('Alle Eingaben in diesem Entwurf zurücksetzen?')){ store=seed(); save(); applyTheme(); ui.kueche.sel={}; ui.kueche.checked={}; ui.kueche.result=null; ui.kueche.q=''; ui.kueche.detail=null; ui.kueche.form=null; ui.kueche.catFilter=null; render(); toast('Zurückgesetzt.'); }
      break;
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key==='Enter' && ev.target && ev.target.id==='t-new'){ ev.preventDefault(); addTask(); }
});
document.addEventListener('input', function(ev){
  if(ev.target && ev.target.id==='k-search'){
    ui.kueche.q=ev.target.value;
    var t=$('#tiles'); if(t) t.innerHTML=tilesGrid(visibleDishes(),emptyMsgK());
  }
});

load(); applyTheme(); render();
})();
</script>
</body>
</html>
